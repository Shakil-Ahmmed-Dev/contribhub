services:
  postgres:
    image: postgres:17-alpine
    container_name: contribhub-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contribhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contribhub_dev}
      POSTGRES_DB: ${POSTGRES_DB:-contribhub}
    volumes:
      - contribhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contribhub} -d ${POSTGRES_DB:-contribhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contribhub_pgdata:
